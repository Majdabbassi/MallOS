spring.application.name=mallos
server.port=${PORT:8080}
spring.profiles.default=dev

# MySQL Database Configuration (values come from environment variables)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/mallos}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Swagger/OpenAPI Configuration
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.dark-mode=true
springdoc.swagger-ui.show-common-extensions=true
springdoc.api-docs.path=/v3/api-docs


# Bootstrap SUPER_ADMIN account (optional; see DataInitializer).
# Only creates an admin when the database is empty and ADMIN_PASSWORD is set.
admin.username=${ADMIN_USERNAME:}
admin.email=${ADMIN_EMAIL:}
admin.password=${ADMIN_PASSWORD:}

# Demo data (seeded only when the database has no malls yet).
demo.enabled=${DEMO_ENABLED:true}
demo.manager.username=${DEMO_MANAGER_USERNAME:manager}
demo.manager.email=${DEMO_MANAGER_EMAIL:manager@mallos.local}
demo.manager.password=${DEMO_MANAGER_PASSWORD:Manager@123}

# File Upload — Floor Plan Images
upload.dir=${UPLOAD_DIR:./uploads}
spring.servlet.multipart.max-file-size=${MAX_FILE_SIZE:20MB}
spring.servlet.multipart.max-request-size=${MAX_REQUEST_SIZE:25MB}
spring.web.resources.static-locations=classpath:/static/

# JWT — signing secret and token lifetime
# The secret must be at least 32 bytes long for HS256. Override in production.
jwt.secret=${JWT_SECRET:dev-only-change-me-signing-key-32-bytes-minimum}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}