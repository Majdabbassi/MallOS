spring.application.name=mallos

# MySQL Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/mallos
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Swagger/OpenAPI Configuration
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.dark-mode=true
springdoc.swagger-ui.show-common-extensions=true
springdoc.api-docs.path=/v3/api-docs

# Basic Auth for Swagger (hardcoded credentials)
spring.security.user.name=admin
spring.security.user.password=swagger123

# File Upload — Floor Plan Images
upload.dir=./uploads
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=25MB
spring.web.resources.static-locations=file:./uploads/,classpath:/static/
