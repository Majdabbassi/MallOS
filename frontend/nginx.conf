server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    # Serve Angular SPA — let the client-side router handle unknown paths
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API calls to the backend container
    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy auth endpoints
    location /auth/ {
        proxy_pass http://backend:8080/auth/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy Swagger/OpenAPI docs
    location /v3/ {
        proxy_pass http://backend:8080/v3/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location /swagger-ui/ {
        proxy_pass http://backend:8080/swagger-ui/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location /swagger-resources/ {
        proxy_pass http://backend:8080/swagger-resources/;
        proxy_set_header Host $host;
    }

    # Proxy error endpoint (used by security handshake)
    location = /error {
        proxy_pass http://backend:8080/error;
        proxy_set_header Host $host;
    }
}